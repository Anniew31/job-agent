<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume - {{ name }}</title>
    <style>
        @page {
            size: letter;
            margin: 0.5in;
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11pt;
            line-height: 1.35;
            color: #000;
            margin: 0;
            padding: 0;
        }
        a { color: #000; text-decoration: underline; }
        .header { text-align: center; margin-bottom: 8px; }
        .name { font-size: 22pt; text-transform: uppercase; font-weight: bold; margin: 0; }
        .contact { font-size: 10pt; margin-top: 2px; }
        
        section { margin-top: 10px; }
        h2 {
            font-size: 13pt;
            text-transform: uppercase;
            font-weight: normal;
            letter-spacing: 0.5px;
            margin: 0;
            padding: 0;
            border-bottom: 1px solid #000;
            padding-bottom: 2px;
        }
        .subheading-row {
            display: flex;
            justify-content: space-between;
            font-size: 11pt;
            margin-top: 5px;
        }
        .bold { font-weight: bold; }
        .italic { font-style: italic; font-size: 10pt; }
        ul { margin: 2px 0 0 0; padding-left: 20px; }
        li { font-size: 10pt; margin-bottom: 2px; }
        .skills-item { margin-top: 5px; font-size: 10pt; }
    </style>
</head>
<body>

    <div class="header">
        <div class="name">{{ name }}</div>
        <div class="contact">{{ contact_info }}</div>
    </div>

    <section>
        <h2>Education</h2>
        {{ education_section }}
    </section>

    <section>
        <h2>Experience</h2>
        {{ experience_section }}
    </section>
    <section>
        <h2>Projects</h2>
        {{ projects_section }}
    </section>

    <section>
        <h2>Technical Skills</h2>
        <div class="skills-item">
            {{ skills_section }}
        </div>
    </section>

</body>
</html>
