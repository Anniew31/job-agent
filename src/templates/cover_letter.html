<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cover Letter</title>
    <style>
        @page {
            size: letter;
            margin: 0.25in 1in 1in 1in;
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #000;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #000;
            padding-bottom: 8px;
        }
        .name { font-size: 18pt; text-transform: uppercase; font-weight: bold; margin: 0; }
        .contact { font-size: 10pt; margin-top: 2px; }
        .recipient-block { margin-bottom: 10px; font-size: 11pt; line-height: 1.3; }
        .letter-content { text-align: justify; white-space: pre-line; }
        .signature { margin-top: 3px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="name">{{ name }}</div>
        <div class="phone">{{ phone }}</div>
        <div class="email">{{ email }}</div>
    </div>

    <div class="recipient-block">
        <strong>Date:</strong> {{ date }}<br>
        <strong>To:</strong> Hiring Team / Recruiter<br>
        <strong>Company:</strong> {{ company }}<br>
        <strong>Role:</strong> {{ job_title }}
    </div>

    <div class="letter-content">
        {{ cover_letter_body }}
    </div>

    <div class="signature">
        Sincerely,<br><br>
        <strong>{{ name }}</strong>
    </div>

</body>
</html>
